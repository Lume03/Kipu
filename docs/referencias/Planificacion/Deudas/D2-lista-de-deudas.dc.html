<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Planificación · Lista de deudas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif}
a{text-decoration:none;color:inherit}
button{font-family:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F8FAFC;color:#0F172A;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

<div style="display:flex;align-items:center;gap:10px;padding:24px 16px 10px 16px;background:#fff;flex-shrink:0">
<div style="flex:1;font-size:22px;font-weight:800">Planificación</div>
<span aria-label="Notificaciones" style="width:44px;height:44px;border-radius:22px;background:#fff;border:1px solid #E2E8F0;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></span>
<span aria-label="Ajustes" style="width:44px;height:44px;border-radius:22px;background:#fff;border:1px solid #E2E8F0;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></span>
</div>

<div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 12px; width: 358px; height: 595px">
<div style="display:flex;background:#E6EDF1;border-radius:16px;padding:4px;gap:4px;margin-top:2px;flex-shrink:0">
<a href="MetasLista.dc.html" style="flex:1;min-width:0;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;white-space:nowrap;color:#475569;font-weight:600"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h12l-2 4 2 4H5"></path></svg>Metas</a>
<a href="Main.dc.html" style="flex:1;min-width:0;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;white-space:nowrap;color:#475569;font-weight:600"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></svg>Presupuestos</a>
<div style="flex:1;min-width:0;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;white-space:nowrap;background:#fff;color:#0F766E;font-weight:700;box-shadow:0 1px 3px rgba(15,23,42,.14)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-5 9 5"></path><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"></path><path d="M3 21h18"></path></svg>Deudas</div>
</div>

<div style="background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 1px 3px rgba(15,23,42,.07);display:flex;flex-shrink:0">
<div style="flex:1">
<div style="font-size:12px;color:#475569;font-weight:500">Debo (pasivos pendientes)</div>
<div style="font-size:20px;font-weight:800;color:#B42F2F;margin-top:2px">S/ 2,400.00</div>
</div>
<div style="width:1px;background:#E6ECF0;margin:0 14px"></div>
<div style="flex:1">
<div style="font-size:12px;color:#475569;font-weight:500">Me deben (por cobrar)</div>
<div style="font-size:20px;font-weight:800;color:#166534;margin-top:2px">S/ 150.00</div>
</div>
</div>

<div style="display:flex;gap:8px;align-items:center;flex-shrink:0">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
<button aria-pressed="{{ c.on }}" onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.label }}</button>
</sc-for>
<a href="DeudasLimite.dc.html" aria-label="Límite del plan alcanzado: mejorar a PRO" style="margin-left:auto;height:44px;padding:0 14px;border-radius:22px;background:#FFF8E1;border:1.5px solid #F3D58A;color:#8A4B00;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Nueva</a>
</div>

<sc-for list="{{debts}}" as="d" hint-placeholder-count="3">
<div style="position:relative;background:#fff;border-radius:18px;box-shadow:0 1px 3px rgba(15,23,42,.07);flex-shrink:0">
<a href="DeudaDetalle.dc.html" style="display:block;padding:14px 16px">
<div style="display:flex;align-items:center;gap:12px">
<span style="{{ d.tile }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ d.arrow }}"></path></svg></span>
<span style="flex:1;min-width:0;padding-right:34px"><span style="display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ d.name }}</span><span style="display:flex;align-items:center;gap:6px;margin-top:3px"><span style="{{ d.chip }}">{{ d.type }}</span><span style="font-size:12px;color:#475569">{{ d.concept }}</span></span></span>
</div>
<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px">
<div><div style="font-size:12px;color:#475569;font-weight:500">Saldo pendiente</div><div style="font-size:22px;font-weight:800;letter-spacing:-0.01em">{{ d.left }}<span style="font-size:12px;color:#475569;font-weight:500"> / {{ d.total }}</span></div></div>
<div style="text-align:right"><div style="font-size:12px;color:#475569;font-weight:500">Pagado</div><div style="font-size:16px;font-weight:800">{{ d.pct }}%</div></div>
</div>
<div style="height:10px;border-radius:5px;background:#E8EEF2;margin-top:8px;overflow:hidden"><div style="{{ d.bar }}"></div></div>
<div style="margin-top:10px"><span style="{{ d.pill }}">{{ d.due }}</span></div>
</a>
<a href="DeudaDetalle.dc.html" aria-label="Más acciones" style="position:absolute;top:8px;right:6px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#475569"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></a>
</div>
</sc-for>
</div>

<div style="height:76px;background:#fff;border-top:1px solid #E6ECF0;display:flex;align-items:center;padding:0 12px 0 8px;gap:2px;flex-shrink:0">
<span title="Pendiente en el prototipo: pantalla existente en la app real, sin artboard en este lienzo" aria-disabled="true" style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:#475569;font-size:11px;font-weight:500;white-space:nowrap"><span style="width:52px;height:28px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h12v4"></path><path d="M4 7v11a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-2z"></path><path d="M16 14.5h.01"></path></svg></span>Dinero</span>
<span title="Pendiente en el prototipo: pantalla existente en la app real, sin artboard en este lienzo" aria-disabled="true" style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:#475569;font-size:11px;font-weight:500;white-space:nowrap"><span style="width:52px;height:28px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></span>Movimientos</span>
<a href="Main.dc.html" style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:#0B5F58;font-size:11px;font-weight:700;white-space:nowrap"><span style="width:52px;height:28px;border-radius:14px;background:#CDEFE8;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3.5"></circle></svg></span>Planificación</a>
<a href="Analisis.dc.html" style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:#475569;font-size:11px;font-weight:500;white-space:nowrap"><span style="width:52px;height:28px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-7"></path></svg></span>Análisis</a>
<div style="width:56px;height:56px;border-radius:28px;background:#0F766E;color:#fff;display:flex;align-items:center;justify-content:center;margin-left:4px;flex-shrink:0;box-shadow:0 4px 12px rgba(15,118,110,.4)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { filter:'todas' };
  renderVals() {
    const f = this.state.filter;
    const pill = (bg, ink) => 'display:inline-block;font-size:12px;font-weight:700;border-radius:10px;padding:4px 10px;background:'+bg+';color:'+ink;
    const chip = (bg, ink) => 'font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:'+bg+';color:'+ink;
    const tile = (bg, fg) => 'width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:'+bg+';color:'+fg;
    const OUT = 'M7 17L17 7M9 7h8v8';
    const IN = 'M17 7L7 17M15 17H7V9';
    const raw = [
      { dir:'debo', name:'Préstamo BCP', concept:'Cuotas mensuales', left:'S/ 2,400.00', total:'S/ 4,000.00', pct:40, due:'Cuota de S/ 400 vence en 4 días', tone:'warn' },
      { dir:'cobro', name:'Carlos R.', concept:'Préstamo personal', left:'S/ 150.00', total:'S/ 300.00', pct:50, due:'Vencida hace 3 días', tone:'late' }
    ];
    const shown = raw.filter(d => f==='todas' || (f==='debo' && d.dir==='debo') || (f==='cobro' && d.dir==='cobro'));
    const debts = shown.map(d => {
      const out = d.dir==='debo';
      const tone = { warn:['#FEF3C7','#8A4B00'], late:['#FDECEC','#B42F2F'], none:['#EDF1F4','#475569'] }[d.tone];
      return {
        name:d.name, concept:d.concept, left:d.left, total:d.total, pct:d.pct, due:d.due,
        type: out ? 'Debo' : 'Me deben',
        chip: out ? chip('#FDECEC','#B42F2F') : chip('#DCFCE7','#166534'),
        tile: out ? tile('#FDECEC','#B42F2F') : tile('#DCFCE7','#166534'),
        arrow: out ? OUT : IN,
        bar:'height:10px;border-radius:5px;width:'+d.pct+'%;background:'+(out?'#14A38F':'#16A34A'),
        pill: pill(tone[0], tone[1])
      };
    });
    const mk = (id, label, n) => ({ label:label+' '+n, on:f===id, pick:()=>this.setState({filter:id}),
      style:'height:44px;padding:0 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid '+(f===id?'#0F766E':'#D5DEE5')+';background:'+(f===id?'#0F766E':'#fff')+';color:'+(f===id?'#fff':'#334155') });
    return { debts, chips:[ mk('todas','Todas',2), mk('debo','Debo',1), mk('cobro','Me deben',1) ] };
  }
}
</script>
</body>
</html>
